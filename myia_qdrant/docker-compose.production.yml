# Docker Compose - Configuration Production Qdrant
# Date: 2025-10-15
# Optimisations: Healthcheck actif, limites ressources ajustées, timeouts GRPC

services:
  qdrant:
    # Pinned to v1.18.2 (2026-06-26): patch over v1.18.1 — security fixes (REST auth whitelist bypass
    # on crafted paths, OOB heap read via malicious snapshot) + optimizer infinite-loop fix (multi-vectors
    # + prevent_unoptimized) + cleanup of unfinished segment optimizations on cancel/restart.
    # No breaking change, no migration (same 1.18 minor; TurboQuant format unchanged, recall@10=1.0 preserved).
    # TurboQuant quantization (milestone 48) requires >= 1.18.0. Bump deliberately, not via a mutable tag.
    image: qdrant/qdrant:v1.18.2
    container_name: qdrant_production
    restart: always
    
    # Grace period pour arrêt propre (flush des données)
    stop_grace_period: 60s

    # ANTI-SPLIT-BRAIN GATE (2026-05-21) : refuse de démarrer si le sentinelle VHDX est absent.
    # Le sentinelle vit SUR le VHDX (/qdrant/storage/.qdrant_vhdx_sentinel). Si /qdrant/storage
    # est le rootfs leftover vide (VHDX non monté), le sentinelle est absent → exit 1 au lieu de
    # servir un store vide et réindexer dans le vide (mécanisme de la perte de données 2026-05-16).
    # `exec ./entrypoint.sh` : entrypoint.sh devient PID 1 → SIGTERM/arrêt gracieux préservés.
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ ! -f /qdrant/storage/.qdrant_vhdx_sentinel ]; then
          echo "[SENTINEL] FATAL: /qdrant/storage/.qdrant_vhdx_sentinel absent -- VHDX non monte. Refus de demarrer (anti-split-brain: indexerait dans le vide)." >&2
          exit 1
        fi
        echo "[SENTINEL] OK: sentinelle VHDX present, demarrage Qdrant."
        exec ./entrypoint.sh

    env_file:
      - .env.production
    
    # Variables d'environnement pour tuning Qdrant
    environment:
      # Limite taille requêtes HTTP (protection contre surcharge)
      - QDRANT__SERVICE__MAX_REQUEST_SIZE_MB=32
      
      # Timeout GRPC (protection contre requêtes bloquantes)
      - QDRANT__SERVICE__GRPC_TIMEOUT_MS=60000
      
      # Niveau de log pour diagnostic
      - QDRANT__LOG_LEVEL=INFO
      
      # Désactiver télémétrie (réduit charge réseau)
      - QDRANT__TELEMETRY_DISABLED=true
    
    ports:
      - "6333:6333"  # HTTP/REST API
      - "6334:6334"  # GRPC API
    
    volumes:
      - \\wsl.localhost\Ubuntu\mnt\qdrant-e\qdrant_data\storage:/qdrant/storage
      - \\wsl.localhost\Ubuntu\mnt\qdrant-e\qdrant_data\snapshots:/qdrant/snapshots
      - ./config/production.optimized.yaml:/qdrant/config/production.yaml
    
    # CRITIQUE: Limites de ressources ajustées pour 10M+ vecteurs (2560 dims)
    deploy:
      resources:
        limits:
          # Limite RAM: 60 GB (augmenté de 40G pour marge suffisante — 40G saturait à 96%)
          # TurboQuant 4-bit (always_ram) sur 2560 dims (migré 2026-05-24, engine v1.18.1) :
          # quantized in-RAM + HNSW on-disk + payload indexes + f32 originals (gardés pour rescore) + ~70 autres collections.
          # Marge large : footprint observé ~2.6 GB pour roo_tasks (461K pts post-recreate), bien sous la limite.
          memory: 60G

          # Limite CPU: 12 cœurs (augmenté de 8 pour meilleur parallélisme search)
          # Système a 24 threads, on en réserve 12 pour Qdrant
          cpus: '12'

        reservations:
          # Réservation garantie RAM: 24 GB (augmenté de 16G — garantit binary quant + payload indexes + marge OS)
          memory: 24G

          # Réservation garantie CPU: 4 cœurs
          cpus: '4'
    
    # HEALTHCHECK via bash /dev/tcp (l'image n'a pas curl/wget mais a bash+timeout)
    # Envoie une requête HTTP réelle et vérifie la réponse "healthz check passed"
    # Détecte les freezes (serveur HTTP figé) pas seulement les crashes
    healthcheck:
      test: ["CMD-SHELL", "timeout 10 bash -c 'exec 3<>/dev/tcp/localhost/6333; echo -e \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; timeout 5 cat <&3; exec 3>&-' | grep -q 'healthz check passed'"]
      interval: 30s
      timeout: 15s
      retries: 5
      # 600s : recovery de roo_tasks_semantic_index (~6022 segments, 55M points) prend 5-6 min
      # cold-start. Avant 180s autoheal tuait le container avant la fin de la recovery -> boucle infinie
      start_period: 600s

  # Autoheal: redémarre automatiquement le container Qdrant si le healthcheck échoue 3x
  # Nécessaire car Docker Compose (non-swarm) ne restart pas les containers unhealthy
  autoheal:
    image: willfarrell/autoheal
    container_name: qdrant_autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=60
      - AUTOHEAL_START_PERIOD=300
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=60
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock

# NOTES D'UTILISATION:
# ===================
# 1. Démarrer: docker compose -f docker-compose.production.yml up -d
# 2. Vérifier santé: docker ps (colonne STATUS doit afficher "healthy")
# 3. Logs: docker logs -f qdrant_production
# 4. Stats: docker stats qdrant_production
# 5. Arrêt propre: docker compose -f docker-compose.production.yml down
#
# MONITORING & ANTI-FREEZE:
# - Healthcheck HTTP toutes les 30s (bash /dev/tcp, vérifie réponse réelle)
# - Si 5 échecs consécutifs → marqué unhealthy
# - Autoheal restart automatique (~2min après détection freeze)
# - start_period: 600s (cold-start recovery 6022 segments / 55M points sur VHDX = 5-6 min)
#
# LIMITES RESSOURCES:
# - RAM: 8G réservé, 24G max (10M+ vecteurs, quantization int8, payload indexes)
# - CPU: 4 cœurs réservés, 12 max
# - Timeouts: 60s GRPC, 15s healthcheck